[package]
name = "inferno"
version = "0.1.0"
edition = "2021"
description = "A small autograd + tensor + neural network framework in Rust, with an optional Metal GPU backend."
license = "MIT"
readme = "README.md"

[lib]
name = "inferno"
path = "src/lib.rs"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = { version = "1", optional = true }
metal = { version = "0.29", optional = true }
objc = { version = "0.2", optional = true }

[features]
default = []
parallel = ["rayon"]
metal-gpu = ["dep:metal", "dep:objc"]

[dev-dependencies]
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
